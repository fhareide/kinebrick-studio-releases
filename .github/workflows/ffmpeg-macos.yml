name: FFmpeg for macOS

# The Mac FFmpeg behind the app's Install FFmpeg button. BtbN's builds cover Windows and Linux but
# not the Mac, so this builds one from FFmpeg's own source release: LGPL, universal like the app,
# linked to nothing but the system. The release carries the source too, as the LGPL asks. A new
# build needs a new VERSION or BUILD, and its checksum pinned in the app's `ffmpeg_install.rs`.
on:
  workflow_dispatch:

env:
  VERSION: 8.1.3
  SOURCE_SHA256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
  BUILD: "1"
  # The app's LSMinimumSystemVersion.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Source
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "ffmpeg-$VERSION.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$VERSION.tar.xz"
          echo "$SOURCE_SHA256  ffmpeg-$VERSION.tar.xz" | shasum -a 256 -c
          tar xf "ffmpeg-$VERSION.tar.xz"

      - name: Tools
        run: |
          brew install nasm
          softwareupdate --install-rosetta --agree-to-license

      - name: Build both architectures
        run: |
          for arch in arm64 x86_64; do
            mkdir "build-$arch"
            (
              cd "build-$arch"
              "../ffmpeg-$VERSION/configure" \
                --enable-cross-compile --target-os=darwin --arch="$arch" --cc="clang -arch $arch" \
                --extra-cflags="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
                --extra-ldflags="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
                --disable-autodetect --enable-videotoolbox \
                --disable-doc --disable-debug --disable-ffplay --disable-ffprobe --disable-network \
                --enable-static --disable-shared
              make -j"$(sysctl -n hw.ncpu)" ffmpeg
            )
          done

      - name: Universal program
        run: |
          lipo -create -output ffmpeg build-arm64/ffmpeg build-x86_64/ffmpeg
          strip -x ffmpeg
          # Apple silicon runs only signed programs: ad hoc, as the app is.
          codesign --force --sign - ffmpeg

      - name: Check it
        run: |
          lipo -info ffmpeg
          lipo -info ffmpeg | grep -q x86_64
          lipo -info ffmpeg | grep -q arm64
          ./ffmpeg -hide_banner -L | grep -q "Lesser General Public"
          ./ffmpeg -hide_banner -version | tee version.txt
          ! grep -q -- "--enable-gpl" version.txt
          otool -L ffmpeg | tee linked.txt
          ! tail -n +2 linked.txt | grep -v -E "^\s+/(System/Library|usr/lib)/"
          # What the app asks of it, at the app's arguments. These runners are virtual machines
          # with no video hardware, so software stands in for it here.
          for arch in arm64 x86_64; do
            arch "-$arch" ./ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=gray:s=256x256:d=0.2 \
              -c:v h264_videotoolbox -allow_sw 1 -pix_fmt yuv420p -movflags +faststart -b:v 2000k "out-$arch.mp4"
            test -s "out-$arch.mp4"
          done

      - name: Package
        run: |
          name="ffmpeg-$VERSION-$BUILD-macos-universal-lgpl"
          mkdir -p "$name/bin"
          cp ffmpeg "$name/bin/"
          cp "ffmpeg-$VERSION/COPYING.LGPLv2.1" "ffmpeg-$VERSION/COPYING.LGPLv3" "$name/"
          {
            echo "FFmpeg $VERSION for macOS, built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Source: https://ffmpeg.org/releases/ffmpeg-$VERSION.tar.xz (also on this release)"
            echo
            cat version.txt
          } > "$name/BUILD.txt"
          COPYFILE_DISABLE=1 tar -cJf "$name.tar.xz" "$name"
          shasum -a 256 "$name.tar.xz" | tee sha256.txt
          stat -f "%z bytes" "$name.tar.xz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ffmpeg-$VERSION-$BUILD" "$NAME.tar.xz" "ffmpeg-$VERSION.tar.xz" \
            --repo "$GITHUB_REPOSITORY" --latest=false --title "FFmpeg $VERSION for macOS" \
            --notes "The FFmpeg that Kinebrick Studio's Install FFmpeg button fetches on a Mac: LGPL, universal, built from the source attached here by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
