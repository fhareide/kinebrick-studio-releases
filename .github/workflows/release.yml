name: Release

# Builds Kinebrick Studio from the private source repo and publishes the packages here.
#
# The source is checked out with PRIVATE_REPO_TOKEN (a fine-grained token with read-only
# Contents access to that one repo). It is never committed here. Compiler output uses
# `--message-format short` so a failing build logs file:line and the message, not source lines.
# Tests, fmt and clippy run in the private repo before a release, not here.
#
# Pushing a `v*` tag to the source repo releases it: the source repo's pre-push hook
# (`tools/hooks/pre-push`) creates the same tag here, which builds the source at that tag and
# publishes the release. By hand, from the Actions tab or with:
#   gh workflow run release.yml -R fhareide/kinebrick-studio-releases -f ref=main -f tag=v0.1.0
# Leave `tag` empty to get the packages as workflow artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the source repo to build"
        type: string
        default: main
      tag:
        description: "Release tag to publish (e.g. v0.1.0); empty = artifacts only"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  SOURCE_REPO: fhareide/kinebrick-studio
  # A pushed tag builds the source repo's tag of the same name and releases it.
  SOURCE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: write

jobs:
  # The programs that run programmable hubs' Pybricks programs (`kinebrick-hub`, `mpy-cross`;
  # tools/hub/build.sh in the source repo) for Linux, and the files their build generates, which
  # the Windows build compiles again.
  hub-linux:
    runs-on: ubuntu-22.04
    steps:
      # The hook tags this repo just before the source repo's push lands, so give it a moment.
      - name: Wait for the source tag
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            if git ls-remote --exit-code "https://x-access-token:$TOKEN@github.com/$SOURCE_REPO.git" "refs/tags/$SOURCE_REF" > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "::error::$SOURCE_REF is not in $SOURCE_REPO after 2 minutes"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      # Pybricks' build turns its images into C with Pillow.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Build the hub programs
        run: |
          # The script prints only the log's error lines; show its end too when it fails.
          bash tools/hub/build.sh linux dist/hub dist/hub-generated.tar.gz || {
            tail -60 target/pybricks/bricks/kinebrick/build-ci.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: hub-linux
          path: dist/hub/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hub-generated
          path: dist/hub-generated.tar.gz
          if-no-files-found: error

  build:
    needs: hub-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # Universal binary (Apple silicon + Intel), packaged as an .app in a .dmg.
          - os: macos-latest
            name: macos-universal
          # The oldest supported Ubuntu runner, so the binary runs on older glibc versions too.
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The hook tags this repo just before the source repo's push lands, so give it a moment.
      - name: Wait for the source tag
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            if git ls-remote --exit-code "https://x-access-token:$TOKEN@github.com/$SOURCE_REPO.git" "refs/tags/$SOURCE_REF" > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "::error::$SOURCE_REF is not in $SOURCE_REPO after 2 minutes"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Linux window-system headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev

      - name: Version
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then v="${RELEASE_TAG#v}"; else v="$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PKG=kinebrick-studio-$v-${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            cargo build --release --locked --message-format short -p kb_app --target aarch64-apple-darwin
            cargo build --release --locked --message-format short -p kb_app --target x86_64-apple-darwin
          else
            cargo build --release --locked --message-format short -p kb_app
          fi

      # The hub programs beside the app (dist/hub): Linux's from the hub-linux job; Windows
      # compiles that build's generated files with LLVM's clang; macOS builds its own.
      - uses: actions/download-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: ${{ runner.os == 'Windows' && 'hub-generated' || 'hub-linux' }}
          path: ${{ runner.os == 'Windows' && 'dist/hub-generated' || 'dist/hub' }}
      # Pybricks' build turns its images into C with Pillow.
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
        if: runner.os == 'macOS'
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - name: Hub programs
        run: |
          case "$RUNNER_OS" in
            Windows)
              [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]] || choco install llvm -y --no-progress > /dev/null
              bash tools/hub/build.sh windows dist/hub dist/hub-generated/hub-generated.tar.gz ;;
            macOS) bash tools/hub/build.sh macos dist/hub ;;
            # Artifacts lose the executable bit.
            Linux) chmod +x dist/hub/kinebrick-hub dist/hub/mpy-cross ;;
          esac

      # Every package holds the executable and the hub programs beside it, `data/` (part metadata
      # the app looks for beside it), the README and the licences.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "dist/$PKG"
          cp target/release/kinebrick-studio.exe dist/hub/* "dist/$PKG/"
          cp -r data README.md crates/kb_app/assets/fonts/*-LICENSE.txt "dist/$PKG/"
          cd dist && 7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          echo "ASSET=dist/$PKG.zip" >> "$GITHUB_ENV"

      # The per-user installer (packaging/windows in the source repo), from the same folder as the zip.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress > /dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$VERSION" "-DSourceDir=$(cygpath -w "$PWD/dist/$PKG")" \
            "-DOutputBase=$PKG-setup" packaging/windows/kinebrick-studio.iss
          echo "INSTALLER=dist/$PKG-setup.exe" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/$PKG"
          cp target/release/kinebrick-studio dist/hub/* "dist/$PKG/"
          cp -r data README.md crates/kb_app/assets/fonts/*-LICENSE.txt "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          echo "ASSET=dist/$PKG.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/Kinebrick Studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/kinebrick-studio" \
            target/aarch64-apple-darwin/release/kinebrick-studio target/x86_64-apple-darwin/release/kinebrick-studio
          cp dist/hub/kinebrick-hub dist/hub/mpy-cross "$app/Contents/MacOS/"
          cp -r data README.md crates/kb_app/assets/fonts/*-LICENSE.txt dist/hub/PYBRICKS-LICENSE.txt "$app/Contents/Resources/"
          cp crates/kb_app/assets/logo/kinebrick-studio.icns "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Kinebrick Studio</string>
            <key>CFBundleDisplayName</key><string>Kinebrick Studio</string>
            <key>CFBundleIdentifier</key><string>io.github.fhareide.kinebrick-studio</string>
            <key>CFBundleExecutable</key><string>kinebrick-studio</string>
            <key>CFBundleIconFile</key><string>kinebrick-studio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: not notarized, so the first launch needs right-click > Open. The
          # hub programs are signed on their own first (the app starts them).
          codesign --force --sign - "$app/Contents/MacOS/kinebrick-hub" "$app/Contents/MacOS/mpy-cross"
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "Kinebrick Studio" -srcfolder "$app" -ov -format UDZO "dist/$PKG.dmg"
          echo "ASSET=dist/$PKG.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ env.PKG }}-setup
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kinebrick Studio $RELEASE_TAG" \
            --notes "Windows: the installer (-setup.exe) or the portable zip. macOS: the .dmg (not notarized: right-click > Open on first launch). Linux: the .tar.gz."
